// ═══ JOB SEARCH ENGINE — Google X-ray ATS Board Scanner ═══
const ATS_BOARDS=[
  {id:"lever",name:"Lever",domain:"jobs.lever.co",icon:"L",color:"#4a90d9"},
  {id:"greenhouse",name:"Greenhouse",domain:"boards.greenhouse.io",icon:"G",color:"#3b8427"},
  {id:"ashby",name:"Ashby",domain:"jobs.ashbyhq.com",icon:"A",color:"#6366f1"},
  {id:"workable",name:"Workable",domain:"apply.workable.com",icon:"W",color:"#00b4d8"},
  {id:"workday",name:"Workday",domain:"myworkdayjobs.com",icon:"WD",color:"#0074d9"},
  {id:"smartrecruiters",name:"SmartRecruiters",domain:"jobs.smartrecruiters.com",icon:"SR",color:"#ff6b6b"},
];
const DEFAULT_KEYWORDS=["visual designer","digital designer","graphic designer","brand designer","senior designer"];

function buildXrayQuery(keywords){
  const sites=ATS_BOARDS.map(b=>"site:"+b.domain).join(" OR ");
  const roles=keywords.map(k=>'"'+k+'"').join(" OR ");
  return "("+sites+") ("+roles+")";
}

function detectBoard(url){
  for(const b of ATS_BOARDS){if(url.includes(b.domain))return b;}
  return ATS_BOARDS[0];
}

function parseTitle(title,link){
  // Extract job title and company from Google result title
  const parts=title.split(" - ");
  const jt=parts[0]||title;
  const co=parts.length>1?parts[parts.length-1].replace(/ \| .+$/,"").trim():(function(){try{return new URL(link).hostname.split(".")[0]}catch(e){return"Company"}})();
  return{title:jt.trim(),co:co};
}

// Fetch real jobs via Anthropic API web_search tool
async function fetchRealJobs(keywords,apiKey){
  if(!apiKey)return null;
  const q=buildXrayQuery(keywords);
  try{
    const response=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({
        model:"claude-sonnet-4-5-20250929",
        max_tokens:2000,
        system:"You are a job search assistant. Use web_search to find real job listings, then return ONLY a valid JSON array. No markdown, no backticks, no preamble — just the raw JSON array. If no results, return [].",
        tools:[{type:"web_search_20250305",name:"web_search"}],
        messages:[{role:"user",content:"Search for these design job openings: "+keywords.join(", ")+"\n\nUse this X-ray query: "+q+"\n\nAlso search: "+keywords.slice(0,3).map(k=>k+" remote job 2025").join(", ")+"\n\nReturn a JSON array of jobs found. Each object needs: title (string), company (string), location (string), url (string), board (one of: lever, greenhouse, ashby, workable, workday, smartrecruiters), salary (string, estimate if not listed like \"$120-160K\"). Max 15 results. ONLY the JSON array."}]
      })
    });
    if(!response.ok){console.log("API:",response.status);return null;}
    const data=await response.json();
    let txt="";for(const b of data.content||[]){if(b.type==="text")txt+=b.text;}
    const clean=txt.replace(/```json|```/g,"").trim();
    const m=clean.match(/\[[\s\S]*?\]/);
    if(!m)return null;
    let parsed;try{parsed=JSON.parse(m[0]);}catch(e){return null;}
    if(!Array.isArray(parsed)||!parsed.length)return null;
    const chances=["high","high","high","medium","medium","low"];
    return parsed.slice(0,15).map((item,i)=>{
      const board=ATS_BOARDS.find(b=>b.id===item.board)||detectBoard(item.url||"");
      const tl=(item.title||"").toLowerCase();
      const senTag=tl.includes("principal")?"Principal":tl.includes("director")?"Director":tl.includes("lead")?"Lead":tl.includes("senior")||tl.includes("sr.")?"Senior":tl.includes("junior")?"Mid":"Mid-Senior";
      return{id:i+1,title:item.title||"Design Role",co:item.company||"Company",loc:item.location||"Remote",salary:item.salary||"$100–150K",age:"New",match:Math.max(60,98-i*3-Math.floor(Math.random()*5)),tags:[senTag],chance:chances[Math.min(i,5)],hot:i<3,board:board.id,boardName:board.name,boardIcon:board.icon,url:item.url||"#"};
    });
  }catch(e){console.log("API error:",e);return null;}
}

// ═══ SMART SORT — weighted priority algorithm ═══
function smartSort(mails){
  const now=Date.now()/1000;
  return[...mails].sort((a,b)=>{
    // Weight: priority(50%) + recency(30%) + unread(20%)
    const recA=Math.max(0,1-(now-a.ts)/172800); // decay over 48h
    const recB=Math.max(0,1-(now-b.ts)/172800);
    const sA=a.pri*0.5+recA*100*0.3+(a.u?20:0);
    const sB=b.pri*0.5+recB*100*0.3+(b.u?20:0);
    return sB-sA;
  });
}

function relT(d){const s=(Date.now()-new Date(d))/1e3;if(s<3600)return`${Math.max(1,Math.round(s/60))}m`;if(s<86400)return`${Math.round(s/3600)}h`;return`${Math.round(s/86400)}d`;}

function useLS(key,def){
  const[v,sv]=useState(()=>{try{const s=localStorage.getItem(key);if(!s)return def;const p=JSON.parse(s);return(p&&typeof p==='object'&&!Array.isArray(p)&&def&&typeof def==='object'&&!Array.isArray(def))?{...def,...p}:p;}catch{return def;}});
  useEffect(()=>{try{localStorage.setItem(key,JSON.stringify(v));}catch(e){console.warn('[useLS] storage write failed:',key,e);};},[key,v]);
  return[v,sv];
}

async function fetchRSS(cat){
  if(_newsCache[cat]&&Date.now()-_newsCache[cat].ts<900000)return _newsCache[cat].items;
  const urls=RSS_FEEDS[cat]||[];const out=[];
  for(const url of urls){
    try{
      const r=await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}&count=6`,{signal:AbortSignal.timeout?AbortSignal.timeout(8000):undefined});
      if(r.status===429){console.warn('[fetchRSS] rate limited, using cached/static fallback');continue;}
      const d=await r.json();
      if(d.status!=='ok')continue;
      for(const i of(d.items||[])){
        if(!i.title)continue;
        out.push({title:i.title.replace(/\s+/g,' ').trim(),src:url.replace(/https?:\/\/(www\.)?/,'').split('/')[0],t:relT(i.pubDate),hot:false,url:i.link});

// ═══ RESUME PARSER ═══
async function extractResumeText(file){
  if(file.size>10*1024*1024)throw new Error("Resume too large — max 10MB");
  if(file.type==='application/pdf'||file.name.endsWith('.pdf')){
    if(!window.pdfjsLib)throw new Error("PDF.js not loaded");
    const ab=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:ab}).promise;
    let text='';
    for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const c=await page.getTextContent();text+=c.items.map(it=>it.str).join(' ')+'\n';}
    return text;
  }
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsText(file);});
}
function parseResumeKeywords(text){
  const lo=text.toLowerCase();
  const SKILLS=['figma','sketch','adobe xd','illustrator','photoshop','after effects','cinema 4d','blender','framer','webflow','react','vue','typescript','javascript','python','node','next.js','web3','solidity','ethereum','blockchain','nft','defi','crypto','ui design','ux design','product design','motion design','animation','branding','visual design','design systems','design tokens','html','css','tailwind','ai','llm','prompt engineering','api','leadership','strategy'];
  const TITLES=[{p:/principal\s+designer/,t:'principal designer'},{p:/creative\s+director/,t:'creative director'},{p:/design\s+director/,t:'design director'},{p:/lead\s+designer/,t:'lead designer'},{p:/senior\s+designer/,t:'senior designer'},{p:/product\s+designer/,t:'product designer'},{p:/ui\s*[/\\]?\s*ux/,t:'ui/ux'},{p:/brand\s+designer/,t:'brand designer'},{p:/motion\s+designer/,t:'motion designer'},{p:/fullstack|full.stack/,t:'fullstack'},{p:/frontend|front.end/,t:'frontend engineer'},{p:/web\s+designer/,t:'web designer'}];
  const skills=SKILLS.filter(s=>{const escaped=s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');return new RegExp('(?<![a-z])'+escaped+'(?![a-z])','i').test(lo);});
  const titles=TITLES.filter(({p})=>p.test(lo)).map(({t})=>t).slice(0,3);
  const yrsMatch=lo.match(/(\d+)\+?\s*years?\s+(?:of\s+)?experience/);
  const yrs=yrsMatch?parseInt(yrsMatch[1]):null;
  // Extract name from first line heuristic
  const firstLine=text.split('\n').find(l=>l.trim().length>2&&l.trim().length<60)||'';
  return{skills:skills.slice(0,12),titles,yrs,firstLine:firstLine.trim()};
}
function resumeMatchScore(job,resumeData){
  if(!resumeData)return null;
  const haystack=(job.title+' '+(job.tags||[]).join(' ')).toLowerCase();
  const needles=[...resumeData.skills,...resumeData.titles];
  if(!needles.length)return null;
  const hits=needles.filter(n=>haystack.includes(n.split(' ')[0])).length;
  return Math.min(100,Math.round((hits/Math.max(needles.length,6))*100));
}

// ═══ HERO BG — Interactive ASCII Canvas ═══
function HeroDither({light,fullscreen}){
  const cv=useRef(null);const af=useRef(null);const t=useRef(0);const mode=useRef(light);const fs=useRef(fullscreen);const mouse=useRef({x:-1000,y:-1000});
  mode.current=light;fs.current=fullscreen;
  useEffect(()=>{const c=cv.current;if(!c)return;const ctx=c.getContext("2d");
    const chars=".·:+*#@%&".split("");const cellW=14;const cellH=20;
    const rs=()=>{if(fs.current){c.width=window.innerWidth;c.height=window.innerHeight;}else{const r=c.parentElement.getBoundingClientRect();c.width=Math.floor(r.width);c.height=Math.floor(r.height);}};
    rs();window.addEventListener("resize",rs);
    const onM=e=>{mouse.current={x:e.clientX,y:e.clientY};};
    window.addEventListener("mousemove",onM);
    const draw=()=>{t.current+=.008;const T=t.current;const{width:W,height:H}=c;const isLight=mode.current;
      ctx.fillStyle=isLight?"#f7f7f5":"#080808";ctx.fillRect(0,0,W,H);
      ctx.font="12px 'Space Mono',monospace";ctx.textAlign="center";ctx.textBaseline="middle";
      const cols=Math.ceil(W/cellW);const rows=Math.ceil(H/cellH);
      const mx=mouse.current.x;const my=mouse.current.y;
      // If hero mode (not fullscreen), offset mouse to hero position
      let offX=0,offY=0;
      if(!fs.current&&c.parentElement){const r=c.parentElement.getBoundingClientRect();offX=r.left;offY=r.top;}
      for(let row=0;row<rows;row++){for(let col=0;col<cols;col++){
        const x=col*cellW+cellW/2;const y=row*cellH+cellH/2;
        const dx=x+offX-mx;const dy=y+offY-my;const dist=Math.sqrt(dx*dx+dy*dy);
        const mouseInf=Math.max(0,1-dist/200);
        const w1=Math.sin(col*.08+T*1.2)*Math.cos(row*.06+T*.8);
        const w2=Math.sin((col+row)*.04+T*.6);
        const w3=Math.cos(col*.12-row*.08+T*1.5)*.5;
        let intensity=(w1+w2+w3)/3;intensity=(intensity+1)/2;
        if(mouseInf>0){const ripple=Math.sin(dist*.05-T*4)*mouseInf;intensity=Math.min(1,intensity+ripple*.6+mouseInf*.3);}
        const ci=Math.floor(Math.max(0,Math.min(.99,intensity))*chars.length);
        const alpha=.04+intensity*.14+mouseInf*.35;
        if(isLight){ctx.fillStyle=`rgba(0,0,0,${alpha*0.6})`;}
        else{ctx.fillStyle=`rgba(228,228,236,${alpha})`;}
        ctx.fillText(chars[ci],x,y);
      }}
      af.current=requestAnimationFrame(draw);};
    af.current=requestAnimationFrame(draw);
    const onVis=()=>{if(document.hidden){cancelAnimationFrame(af.current);}else{af.current=requestAnimationFrame(draw);}};
    document.addEventListener("visibilitychange",onVis);
    return()=>{window.removeEventListener("resize",rs);window.removeEventListener("mousemove",onM);cancelAnimationFrame(af.current);document.removeEventListener("visibilitychange",onVis);};
  },[]);
  return <canvas ref={cv} className={fullscreen?"quiet-ascii":"hero-bg"}/>;
}

// ═══ HERO TRAIL — pixelated pierce path ═══
function HeroTrail({containerRef}){
  const cv=useRef(null);const ps=useRef([]);const ms=useRef({x:-999,y:-999});const pms=useRef({x:-999,y:-999});const af=useRef(null);const ls=useRef(0);
  useEffect(()=>{const c=cv.current;const box=containerRef.current;if(!c||!box)return;const ctx=c.getContext("2d");
    const S=5;
    const rs=()=>{const r=box.getBoundingClientRect();c.width=Math.floor(r.width/S);c.height=Math.floor(r.height/S);};rs();window.addEventListener("resize",rs);
    const onM=e=>{const r=box.getBoundingClientRect();const nx=(e.clientX-r.left)/S,ny=(e.clientY-r.top)/S;pms.current={x:ms.current.x,y:ms.current.y};ms.current={x:nx,y:ny};const now=Date.now();if(now-ls.current>10){ls.current=now;const dx=ms.current.x-pms.current.x,dy=ms.current.y-pms.current.y;const spd=Math.sqrt(dx*dx+dy*dy);for(let i=0;i<3;i++){const spread=2+Math.random()*2;ps.current.push({x:ms.current.x+(Math.random()-.5)*spread,y:ms.current.y+(Math.random()-.5)*spread,vx:dx*-.03+(Math.random()-.5)*.15,vy:dy*-.03+(Math.random()-.5)*.15,life:1,decay:.012+Math.random()*.008,size:Math.random()*3+2,bright:Math.min(spd*0.15+0.3,1)});}}};
    const onL=()=>{ms.current={x:-999,y:-999};pms.current={x:-999,y:-999};};box.addEventListener("mousemove",onM);box.addEventListener("mouseleave",onL);
    const B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    const draw=()=>{
      ctx.fillStyle="rgba(0,0,0,0.07)";ctx.fillRect(0,0,c.width,c.height);
      const arr=ps.current;
      for(let i=arr.length-1;i>=0;i--){
        const p=arr[i];p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
        if(p.life<=0){arr.splice(i,1);continue;}
        const rad=Math.max(1,Math.floor(p.size*p.life));
        const cx=Math.floor(p.x),cy=Math.floor(p.y);
        for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){
          const dist=Math.sqrt(dx*dx+dy*dy)/rad;if(dist>1)continue;
          const intensity=(1-dist)*p.life*p.bright;
          const px=cx+dx,py=cy+dy;
          if(px<0||py<0||px>=c.width||py>=c.height)continue;
          const thr=B[((py%4)+4)%4][((px%4)+4)%4]/16;
          if(intensity>thr){
            ctx.fillStyle=`rgba(255,255,255,${Math.min(intensity*p.life*0.4,0.25)})`;
            ctx.fillRect(px,py,1,1);
          }
        }
      }
      if(arr.length>500)arr.splice(0,arr.length-500);
      af.current=requestAnimationFrame(draw);
    };
    af.current=requestAnimationFrame(draw);
    return()=>{box.removeEventListener("mousemove",onM);box.removeEventListener("mouseleave",onL);window.removeEventListener("resize",rs);cancelAnimationFrame(af.current);};
  },[containerRef]);
  return <canvas ref={cv} className="hero-trail"/>;
}

  const ditherImg=src=>{const im=new Image();im.onload=()=>{const cv=document.createElement("canvas");const s=96;cv.width=s;cv.height=s;const ctx=cv.getContext("2d");ctx.drawImage(im,0,0,s,s);const id=ctx.getImageData(0,0,s,s);const d=id.data;const B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];for(let y=0;y<s;y++)for(let x=0;x<s;x++){const i=(y*s+x)*4;const g=(d[i]*.3+d[i+1]*.59+d[i+2]*.11)/255;const on=g>B[y%4][x%4]/16?255:0;d[i]=d[i+1]=d[i+2]=on;}ctx.putImageData(id,0,0);setDith(cv.toDataURL());};im.src=src;};
  return(<div className="pfp" onClick={img?()=>setMode(m=>m==="dither"?"normal":"dither"):()=>fr.current?.click()} title={img?"Click to toggle dither":"Click to upload photo"}>
    <input ref={fr} type="file" accept="image/*" onChange={upload} style={{display:"none"}}/>
    {img?<img src={mode==="dither"?dith:img} alt="Profile" className={`pfp-img ${mode==="dither"?"dith":""}`}/>

  </div>);
}

    const file=e.target.files[0];if(!file)return;
    setResumeParsing(true);setResumeError(null);

      const text=await extractResumeText(file);
      const parsed=parseResumeKeywords(text);
      const rd={name:file.name,uploadedAt:Date.now(),...parsed};
      setResumeData(rd);
      // Merge resume titles into search keywords (dedup)
      const merged=[...new Set([...keywords,...parsed.titles,...parsed.skills.slice(0,3)])];
      setKeywords(merged);
      doScan(merged);
    }catch(err){setResumeError("Could not read resume. Try a .txt or .pdf file.");}

    e.target.value='';
  };

    setScanning(true);
    // Tier 1: Live ATS board public APIs (no key, CORS-safe)
    const ats=await fetchATSJobs(kw);
    if(ats.length>=3){setJobs(ats);setSource("live");setLastScan(new Date());setScanning(false);return;}
    // Tier 2: Anthropic web_search

        <button onClick={()=>{setResumeData(null);setKeywords(DEFAULT_KEYWORDS);doScan(DEFAULT_KEYWORDS);}} className="kw-x" style={{fontSize:11,padding:"0 4px",color:"var(--tx-lo)"}}>×</button>

// Timer merged into TodoStatsCard below

function TodoStatsCard(){
  const [todos,setTodos]=useLS('dd_todos',INIT_TODOS);const [inp,setInp]=useState("");const [active,setActive]=useState("tasks");
  const toggle=id=>setTodos(t=>t.map(x=>x.id===id?{...x,done:!x.done}:x));
  const remove=id=>setTodos(t=>t.filter(x=>x.id!==id));
  const add=()=>{if(!inp.trim())return;setTodos(t=>[...t,{id:Date.now(),text:inp.trim(),done:false,pri:"normal"}]);setInp("");};
  const pc={urgent:"var(--tx-hi)",important:"var(--tx-md)",normal:"var(--tx-lo)"};
  const stats=[{l:"APPS SENT",v:"14"},{l:"FOCUS",v:"4.5h"},{l:"STREAK",v:"7d"}];
  const [dur,setDur]=useState(1500);const [left,setLeft]=useState(1500);const [run,setRun]=useState(false);const [brk,setBrk]=useState(false);const [sess,setSess]=useState(3);const [flash,setFlash]=useState(false);const iv=useRef(null);
  // Use refs to read latest values inside the interval without re-creating it
  const runRef=useRef(run);const brkRef=useRef(brk);const durRef=useRef(dur);
  runRef.current=run;brkRef.current=brk;durRef.current=dur;
  useEffect(()=>{
    clearInterval(iv.current);
    if(!run){return;}
    iv.current=setInterval(()=>{
      setLeft(t=>{
        if(t<=1){
          // Timer hit zero — transition atomically inside the setter
          clearInterval(iv.current);
          setRun(false);
          setFlash(true);setTimeout(()=>setFlash(false),1600);
          if(!brkRef.current){setSess(s=>s+1);setBrk(true);return 300;}
          else{setBrk(false);return durRef.current;}
        }
        return t-1;
      });
    },1000);
    return()=>clearInterval(iv.current);
  },[run]);
  const pct=brk?1-left/300:1-left/dur;const st=!run&&left===dur&&!brk?"READY":run?(brk?"BREAK":"FOCUS"):"PAUSED";
  // Sync global state for PiP widget
  const tasksLeft=todos.filter(t=>!t.done).length;
  useEffect(()=>{window._dd_state={tL:left,tR:run,tS:st,tK:tasksLeft,un:ALL_MAIL.filter(m=>m.u).length};},[left,run,st,tasksLeft]);
  useEffect(()=>{window._dd_toggleTimer=()=>setRun(r=>!r);return()=>{delete window._dd_toggleTimer;};},[]);

  return(<Card area="todo" cls="ni"><div className="todo-wrap">
    {/* POMODORO — top half */}
    <div className={`tmr-hero ${flash?"timer-done":""}`}>
      <div style={{position:"relative"}}>
        <svg width={96} height={96} viewBox="0 0 96 96" style={{transform:"rotate(-90deg)",display:"block"}}><circle cx={48} cy={48} r={42} fill="none" stroke="var(--bd)" strokeWidth={2}/><circle cx={48} cy={48} r={42} fill="none" stroke="var(--tx-hi)" strokeWidth={2} strokeDasharray={2*Math.PI*42} strokeDashoffset={2*Math.PI*42*(1-pct)} strokeLinecap="round" style={{transition:"stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)"}}/></svg>
        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <span style={{fontSize:20,fontWeight:800,fontFamily:"'Space Mono',monospace",color:"var(--tx-hi)",lineHeight:1}}>{fmt(left)}</span>
          <Mo s={8} c="var(--tx-md)" st={{marginTop:3}}>{st}</Mo>
        </div>
      </div>
      <div style={{display:"flex",gap:4,alignItems:"center"}}>
        <button onClick={()=>setRun(!run)} className="ba pri" style={{padding:"5px 16px",fontSize:9}}>{run?"PAUSE":"START"}</button>
        <button onClick={()=>{setRun(false);setBrk(false);setLeft(dur);}} className="ba sec" style={{padding:"5px 12px",fontSize:9}}>RESET</button>
      </div>
      <div style={{display:"flex",gap:3,alignItems:"center"}}>
        {[25,30,35,40].map(m=>(<button key={m} onClick={()=>{if(!run){setDur(m*60);setLeft(m*60);}}} className={`csm ${dur===m*60?"on":""}`} style={{opacity:run?.35:1,fontSize:8,padding:"2px 7px"}}>{m}m</button>))}
        <Mo s={8} c="var(--tx-lo)" st={{marginLeft:4}}>{sess} today</Mo>
      </div>
    </div>
    {/* TASKS — bottom half */}
    <div className="todo-tasks-half">
      <div className="ch" style={{padding:"8px 14px"}}><div style={{display:"flex",alignItems:"center",gap:6}}>{Ic.tasks({s:12,c:"var(--tx-hi)"})}<Mo s={11} c="var(--tx-hi)" w={700} ls="0.12em">TASKS</Mo></div><Mo s={9} c="var(--tx-lo)">{todos.filter(t=>!t.done).length} LEFT</Mo></div>
      <div className="cs" style={{flex:1,overflow:"auto"}}>{todos.length===0?<div style={{padding:"16px 12px",textAlign:"center"}}><Mo s={10} c="var(--tx-lo)">No tasks yet</Mo></div>:<>{todos.filter(t=>!t.done).map(t=>(<div key={t.id} className="lr" style={{transition:"all .3s cubic-bezier(.4,0,.2,1)"}}><div className="ck" onClick={()=>toggle(t.id)} style={{borderColor:pc[t.pri],cursor:"pointer"}}/><span style={{fontSize:12,color:"var(--tx-md)",flex:1,lineHeight:1.35,transition:"all .3s",cursor:"pointer"}} onClick={()=>toggle(t.id)}>{t.text}</span><span style={{width:5,height:5,borderRadius:"50%",background:pc[t.pri],flexShrink:0}}/><button onClick={()=>remove(t.id)} className="task-rm">{Ic.x({s:10,c:"var(--tx-lo)"})}</button></div>))}{todos.some(t=>t.done)&&<>{todos.filter(t=>t.done).map(t=>(<div key={t.id} className="lr" style={{opacity:.4,transition:"all .3s cubic-bezier(.4,0,.2,1)"}}><div className="ck done" onClick={()=>toggle(t.id)} style={{cursor:"pointer"}}>{Ic.check({s:10,c:"var(--tx-lo)"})}</div><span style={{fontSize:12,color:"var(--tx-lo)",textDecoration:"line-through",flex:1,transition:"all .3s",cursor:"pointer"}} onClick={()=>toggle(t.id)}>{t.text}</span><button onClick={()=>remove(t.id)} className="task-rm">{Ic.x({s:10,c:"var(--tx-lo)"})}</button></div>))}</>}</>}</div>
      <div className="ti"><input value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="+ Add task..." className="inp"/><button onClick={add} className="ab2">ADD</button></div>
    </div>
  </div></Card>);
}

function QwPomo(){
  const [dur,setDur]=useState(1500);const [left,setLeft]=useState(1500);const [run,setRun]=useState(false);const [sess,setSess]=useState(3);const iv=useRef(null);
  useEffect(()=>{if(run&&left>0)iv.current=setInterval(()=>setLeft(t=>t-1),1000);else if(left===0){setRun(false);setSess(s=>s+1);setLeft(dur);}return()=>clearInterval(iv.current);},[run,left,dur]);
  const pct=1-left/dur;const circ=2*Math.PI*38;
  return(<div className="qw">
    <div className="ch" style={{padding:"10px 14px"}}><div style={{display:"flex",alignItems:"center",gap:6}}>{Ic.timer({s:12,c:"var(--tx-hi)"})}<Mo s={10} c="var(--tx-hi)" w={700} ls="0.12em">FOCUS</Mo></div><Mo s={8} c="var(--tx-lo)">{sess} TODAY</Mo></div>

        <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}><span style={{fontFamily:"'Space Mono',monospace",fontSize:18,fontWeight:800,color:"var(--tx-hi)"}}>{fmt(left)}</span></div>
      </div>
    </div>
    <div style={{display:"flex",gap:3,justifyContent:"center",padding:"0 12px 4px"}}>
      <button onClick={()=>{if(left===0){setLeft(dur);setRun(true);}else setRun(!run);}} className="ba pri" style={{padding:"4px 14px",fontSize:8}}>{run?"PAUSE":"START"}</button>
      <button onClick={()=>{setRun(false);setLeft(dur);}} className="ba sec" style={{padding:"4px 10px",fontSize:8}}>RESET</button>

    </div>
  </div>);

function QwCal(){
  const [checked,setChecked]=useState(()=>{const s=new Set();[3,4,5,7,8,9,10,12,13,14,15,17,18].forEach(d=>s.add(d));return s;});
  const now=new Date();const yr=now.getFullYear();const today=now.getDate();
  const daysInMonth=new Date(yr,now.getMonth()+1,0).getDate();const firstDay=new Date(yr,now.getMonth(),1).getDay();
  const toggleDay=d=>{if(d>today)return;setChecked(p=>{const n=new Set(p);n.has(d)?n.delete(d):n.add(d);return n;});};
  const streak=(()=>{let s=0;for(let d=today;d>=1;d--){if(checked.has(d)||(d===today))s++;else break;}return s;})();
  return(<div className="qw">
    <div className="ch" style={{padding:"10px 14px"}}><div style={{display:"flex",alignItems:"center",gap:6}}>{Ic.cal({s:12,c:"var(--tx-hi)"})}<Mo s={10} c="var(--tx-hi)" w={700} ls="0.12em">CALENDAR</Mo></div><div style={{display:"flex",alignItems:"center",gap:4}}>{streak>1&&<Tag inv style={{fontSize:7,padding:"1px 5px"}}>{streak}D</Tag>}<Mo s={8} c="var(--tx-lo)">{checked.size}/{daysInMonth}</Mo></div></div>
    <div style={{padding:"4px 10px",flex:1,display:"flex",flexDirection:"column"}}>
      <Mo s={9} c="var(--tx-md)" w={500} st={{marginBottom:4}}>{now.toLocaleString("en-US",{month:"long"})} {yr}</Mo>
      <div className="qw-cal-days">{["S","M","T","W","T","F","S"].map((d,i)=><div key={i} className="qw-cal-h">{d}</div>)}</div>
      <div className="qw-cal">{Array.from({length:firstDay},(_,i)=><div key={"e"+i} className="qw-cal-d mt"/>)}{Array.from({length:daysInMonth},(_,i)=>{const d=i+1;const done=checked.has(d);const isToday=d===today;const future=d>today;return(<button key={d} onClick={()=>toggleDay(d)} className={"qw-cal-d "+(done?"dn ":"")+(isToday?"td ":"")+(future?"fu ":"")} disabled={future} style={{cursor:future?"default":"pointer",background:"none",border:"none"}}>{d}</button>);})}</div>
    </div>
  </div>);
}

.sc{background:var(--rs);border:1px solid var(--bd);padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:6px;}
.sn{font-size:20px;font-weight:800;font-family:'Space Mono',monospace;line-height:1;color:var(--tx-hi);}
.ba{border:1px solid var(--bd);padding:7px 18px;cursor:pointer;font-size:10px;font-weight:600;font-family:'Space Mono',monospace;letter-spacing:.06em;transition:all .2s cubic-bezier(.4,0,.2,1);background:transparent;color:var(--tx-lo);border-radius:6px;}
.ba.pri{background:var(--inv-bg);border-color:transparent;color:var(--inv-tx);}.ba.sec{border-color:var(--bd);}.ba:hover{filter:brightness(1.08);}.ba.sec:hover{border-color:var(--bd-hi);color:var(--tx-md);}
.csm{padding:3px 9px;border:1px solid transparent;font-size:9px;font-weight:600;font-family:'Space Mono',monospace;background:transparent;cursor:pointer;color:var(--tx-lo);border-radius:4px;transition:all .2s cubic-bezier(.4,0,.2,1);}.csm.on{background:var(--inv-bg);border-color:transparent;color:var(--inv-tx);}.csm:hover:not(.on){color:var(--tx-md);}
.aH{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border:none;background:transparent;cursor:pointer;width:100%;text-align:left;flex-shrink:0;gap:8px;transition:background .2s cubic-bezier(.4,0,.2,1);}.aH:hover{background:var(--glow);}.aH.open{border-bottom:1px solid var(--bd);}.aH-l{display:flex;align-items:center;gap:6px;}
.aA{font-family:'Space Mono',monospace;font-size:10px;color:var(--tx-hi);width:12px;display:inline-block;}
.aB{flex:0 0 0;overflow:hidden;display:flex;flex-direction:column;transition:flex .3s cubic-bezier(.4,0,.2,1);}.aB.open{flex:0 1 auto;overflow:auto;}
.ck{width:14px;height:14px;border:1.5px solid;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;border-radius:3px;transition:all .15s;}.ck.done{border-color:var(--tx-lo);background:var(--glow);color:var(--tx-md);}
.ti{display:flex;gap:6px;padding:6px 10px;border-top:1px solid var(--bd);flex-shrink:0;}
.inp{flex:1;background:var(--rs);border:1px solid var(--bd);padding:6px 10px;color:var(--tx-hi);font-size:11px;outline:none;font-family:inherit;min-width:0;transition:all .2s cubic-bezier(.4,0,.2,1);border-radius:6px;}.inp:focus{border-color:var(--bd-hi);}
.ab2{background:transparent;border:1px solid var(--bd);color:var(--tx-lo);padding:6px 10px;cursor:pointer;font-size:9px;font-weight:600;font-family:'Space Mono',monospace;letter-spacing:.06em;flex-shrink:0;transition:all .2s cubic-bezier(.4,0,.2,1);border-radius:6px;}.ab2:hover{background:var(--inv-bg);color:var(--inv-tx);border-color:transparent;}
.ri{width:30px;height:30px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--rs);border-radius:6px;}
.stxt{font-size:11px;color:var(--tx-md);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.li{padding:10px 16px;display:flex;flex-direction:column;gap:6px;background:var(--sf);border:1px solid var(--bd);height:100%;}
.log-card{position:sticky;bottom:0;z-index:50;}
.ll{display:flex;flex-direction:column;}.ln{font-family:'Space Mono',monospace;font-size:10px;line-height:1.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s;}
.sel{flex:1;background:var(--rs);border:1px solid var(--bd);padding:7px 12px;color:var(--tx-hi);font-size:11px;font-family:'Space Mono',monospace;outline:none;min-width:0;cursor:pointer;border-radius:6px;transition:all .2s cubic-bezier(.4,0,.2,1);}.sel:focus{border-color:var(--bd-hi);}
.send-btn{background:var(--inv-bg);border:1px solid transparent;color:var(--inv-tx);padding:8px 20px;cursor:pointer;font-size:10px;font-weight:600;font-family:'Space Mono',monospace;letter-spacing:.06em;transition:all .2s cubic-bezier(.4,0,.2,1);border-radius:6px;}.send-btn:hover{opacity:.85;}.send-btn:disabled{opacity:.4;cursor:default;}
.tpl-del{background:none;border:none;cursor:pointer;color:var(--tx-lo);font-size:9px;padding:2px 4px;line-height:1;transition:all .2s;border-radius:3px;}.tpl-del:hover{color:var(--tx-hi);background:var(--glow);}
.mbg{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px;animation:mdIn .2s ease;}
@keyframes mdIn{from{opacity:0;}to{opacity:1;}}
.root.light .mbg{background:rgba(0,0,0,.25);}
.mbox{background:var(--sf);border:1px solid var(--bd-hi);width:100%;max-width:520px;max-height:80vh;overflow:auto;border-radius:8px;animation:mdBox .2s ease;}
@keyframes mdBox{from{opacity:0;transform:scale(.97) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}

/* ═══ MICRO ANIMATIONS ═══ */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
@keyframes slideR{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:none;}}
@keyframes slideL{from{opacity:0;transform:translateX(8px);}to{opacity:1;transform:none;}}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.15);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-2px);}40%{transform:translateX(2px);}60%{transform:translateX(-1px);}80%{transform:translateX(1px);}}
@keyframes check{from{stroke-dashoffset:24;}to{stroke-dashoffset:0;}}
@keyframes strike{from{width:0;}to{width:100%;}}
@keyframes pulse3{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes countPop{0%{transform:scale(1);}50%{transform:scale(1.25);}100%{transform:scale(1);}}
@keyframes sendFly{0%{transform:translateX(0) translateY(0) scale(1);opacity:1;}100%{transform:translateX(12px) translateY(-8px) scale(.7);opacity:0;}}
@keyframes dotPing{0%{transform:scale(1);opacity:.7;}100%{transform:scale(2.5);opacity:0;}}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes logSlide{from{opacity:0;transform:translateY(10px);filter:blur(2px);}to{opacity:1;transform:none;filter:blur(0);}}
@keyframes timerDone{0%,100%{box-shadow:0 0 0 0 transparent;}50%{box-shadow:0 0 20px 4px rgba(255,255,255,.12);}}
@keyframes breathe{0%,100%{opacity:.35;}50%{opacity:.55;}}

/* Row entrance stagger */
.lr{animation:fadeUp .3s cubic-bezier(.4,0,.2,1) both;}
.cs>.lr:nth-child(1){animation-delay:0s;}.cs>.lr:nth-child(2){animation-delay:.03s;}.cs>.lr:nth-child(3){animation-delay:.06s;}.cs>.lr:nth-child(4){animation-delay:.09s;}.cs>.lr:nth-child(5){animation-delay:.12s;}.cs>.lr:nth-child(6){animation-delay:.15s;}.cs>.lr:nth-child(7){animation-delay:.18s;}.cs>.lr:nth-child(8){animation-delay:.21s;}.cs>.lr:nth-child(9){animation-delay:.24s;}.cs>.lr:nth-child(10){animation-delay:.27s;}

/* Mail category tiles stagger */
.mt2{animation:scaleIn .3s cubic-bezier(.4,0,.2,1) both;}
.mg2>.mt2:nth-child(1){animation-delay:0s;}.mg2>.mt2:nth-child(2){animation-delay:.04s;}.mg2>.mt2:nth-child(3){animation-delay:.08s;}.mg2>.mt2:nth-child(4){animation-delay:.12s;}

/* Mail feed items stagger */
.mail-feed-item{animation:fadeUp .25s cubic-bezier(.4,0,.2,1) both;}
.mail-feed>.mail-feed-item:nth-child(1){animation-delay:0s;}.mail-feed>.mail-feed-item:nth-child(2){animation-delay:.03s;}.mail-feed>.mail-feed-item:nth-child(3){animation-delay:.06s;}.mail-feed>.mail-feed-item:nth-child(4){animation-delay:.09s;}.mail-feed>.mail-feed-item:nth-child(5){animation-delay:.12s;}

/* Unread dot ping animation */
.mail-unread-dot{position:relative;}.mail-unread-dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:inherit;animation:dotPing 2s cubic-bezier(0,0,.2,1) infinite;}

/* Task checkbox animation */
.ck{transition:all .25s cubic-bezier(.4,0,.2,1);}.ck:active{transform:scale(.85);}.ck.done{animation:pop .3s cubic-bezier(.4,0,.2,1);}
.ck.done svg{animation:check .3s cubic-bezier(.4,0,.2,1) both;}

/* Star save bounce */
.sb{transition:transform .2s cubic-bezier(.4,0,.2,1);}.sb:active{transform:scale(.8);}.sb svg{transition:transform .3s cubic-bezier(.4,0,.2,1);}
.star-pop svg{animation:pop .35s cubic-bezier(.4,0,.2,1);}

/* Tag count pop */
.tag{transition:all .2s cubic-bezier(.4,0,.2,1);}
.tag-pop{animation:countPop .3s cubic-bezier(.4,0,.2,1);}

/* Send button fly */
.send-fly{animation:sendFly .5s cubic-bezier(.4,0,.2,1) forwards;}

/* Timer completion flash */
.timer-done{animation:timerDone .8s ease 2;}

/* Log line entrance */
.ln{animation:logSlide .35s cubic-bezier(.4,0,.2,1) both;}

/* News tab content fade */
.news-fade{animation:fadeUp .3s cubic-bezier(.4,0,.2,1) both;}

/* Chip active transition */
.chip{transition:all .2s cubic-bezier(.4,0,.2,1);}.chip:active{transform:scale(.94);}
.ntab{transition:all .2s cubic-bezier(.4,0,.2,1);}.ntab:active{transform:scale(.95);}

/* Button press */
.ba{transition:all .2s cubic-bezier(.4,0,.2,1);}.ba:active{transform:scale(.95);}
.send-btn{transition:all .2s cubic-bezier(.4,0,.2,1);}.send-btn:active:not(:disabled){transform:scale(.96);}
.send-btn.sending{animation:pulse3 .8s ease infinite;background:linear-gradient(90deg,var(--inv-bg) 40%,var(--bd-hi) 50%,var(--inv-bg) 60%);background-size:200% 100%;animation:shimmer 1.5s ease infinite;}
.ab2{transition:all .2s cubic-bezier(.4,0,.2,1);}.ab2:active{transform:scale(.95);}
.hub-btn:active,.lt-btn:active{transform:scale(.94);}

/* Settings toggle smooth */
.set-toggle:active{transform:scale(.9);}

/* Profile photo hover breathe */
.pfp{transition:all .25s cubic-bezier(.4,0,.2,1);}.pfp:hover{transform:scale(1.03);}

/* Stats cards entrance */
.sc{animation:scaleIn .3s cubic-bezier(.4,0,.2,1) both;}
.sg>.sc:nth-child(1){animation-delay:0s;}.sg>.sc:nth-child(2){animation-delay:.05s;}.sg>.sc:nth-child(3){animation-delay:.1s;}.sg>.sc:nth-child(4){animation-delay:.15s;}

/* Stat number shimmer on hover */
.sn{transition:color .2s;}
.sc:hover .sn{color:var(--tx-hi);}

/* Settings section entrance */
.set-section{animation:fadeUp .25s cubic-bezier(.4,0,.2,1);}
.set-field{animation:fadeUp .3s cubic-bezier(.4,0,.2,1) both;}
.set-section>.set-field:nth-child(1){animation-delay:0s;}.set-section>.set-field:nth-child(2){animation-delay:.04s;}.set-section>.set-field:nth-child(3){animation-delay:.08s;}.set-section>.set-field:nth-child(4){animation-delay:.12s;}.set-section>.set-field:nth-child(5){animation-delay:.16s;}.set-section>.set-field:nth-child(6){animation-delay:.2s;}

/* Layout preset button hover lift */
.set-layout-btn{transition:all .2s cubic-bezier(.4,0,.2,1);}.set-layout-btn:hover{transform:translateY(-2px);}.set-layout-btn:active{transform:translateY(0) scale(.97);}

/* Accordion icon rotate */
.aA{transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;}

/* News icon shimmer */
.ri{transition:all .2s cubic-bezier(.4,0,.2,1);}.lr:hover .ri{transform:scale(1.08);border-color:var(--bd-hi);}

/* Social lead card hover */
.stxt{transition:color .2s;}.lr:hover .stxt{color:var(--tx-md);}

/* Music widget hover */
.mw{transition:all .25s cubic-bezier(.4,0,.2,1);}.mw:hover{border-color:rgba(255,255,255,.12);}
.root.light .mw:hover{border-color:rgba(0,0,0,.1);}

/* Hero text entrance */
.hero-t{animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .1s both;}
.hero-d{animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .2s both;}
.hero-name{animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .3s both;}

/* Hover all → link */
.cf Mo[style*="cursor"]:hover{text-decoration:underline;text-underline-offset:2px;}
.mbox-lg{max-width:580px;}
.set-tabs{display:flex;gap:3px;padding:0 20px 12px;border-bottom:1px solid var(--bd);}
.set-section{display:flex;flex-direction:column;gap:16px;}
.set-field{display:flex;flex-direction:column;gap:6px;}
.set-inp{padding:7px 12px !important;font-size:12px !important;background:var(--rs) !important;border-color:var(--bd) !important;}
.set-inp:focus{border-color:var(--bd-hi) !important;outline:none;}
.set-layouts{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.set-layout-btn{background:var(--rs);border:1px solid var(--bd);padding:10px 8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s cubic-bezier(.4,0,.2,1);border-radius:8px;}.set-layout-btn:hover{border-color:var(--bd-hi);}.set-layout-btn.on{border-color:var(--tx-hi);background:var(--glow);}
.set-layout-preview{width:100%;display:flex;flex-direction:column;gap:2px;padding:0 4px;}
.set-toggle{width:32px;height:18px;border-radius:9px;border:1px solid var(--bd);background:var(--rs);cursor:pointer;position:relative;transition:all .25s cubic-bezier(.4,0,.2,1);padding:0;flex-shrink:0;}
.set-toggle.on{background:var(--tx-hi);border-color:transparent;}
.set-toggle-dot{width:12px;height:12px;border-radius:50%;background:var(--tx-lo);position:absolute;top:2px;left:2px;transition:all .25s cubic-bezier(.4,0,.2,1);}
.set-toggle.on .set-toggle-dot{left:16px;background:var(--sf);}
.set-cards-list{border:1px solid var(--bd);padding:4px 12px;border-radius:8px;}
.mhd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd);}.mx{background:none;border:none;color:var(--tx-lo);cursor:pointer;padding:4px;border-radius:6px;transition:all .15s;display:flex;align-items:center;justify-content:center;}.mx:hover{color:var(--tx-hi);background:var(--glow);}

/* ═══ QUIET MODE ═══ */
.quiet-root{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;overflow:hidden;}
.quiet-ascii{position:fixed;inset:0;z-index:0;width:100%;height:100%;}
.quiet-root .hero-trail{position:absolute;inset:0;z-index:5;width:100%;height:100%;image-rendering:pixelated;opacity:0.45;pointer-events:none;}
.quiet-bar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:rgba(8,8,8,0.82);border-bottom:1px solid var(--bd);}
.root.light .quiet-bar{background:rgba(247,247,245,0.4);}

/* FL Studio DAW buttons */
.daw-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--tx-md);background:var(--rs);border:1px solid var(--bd);border-radius:4px;cursor:pointer;transition:border-color .15s ease,color .15s ease;text-transform:uppercase;position:relative;}
.daw-btn:hover{border-color:var(--bd-hi);color:var(--tx-hi);}
.daw-btn:active{transform:translateY(1px);}
.daw-btn.daw-on{background:var(--rs);border-color:rgba(249,115,22,.4);color:var(--tx-hi);}
.daw-led{width:5px;height:5px;border-radius:50%;flex-shrink:0;transition:background .3s ease;}
.root.light .daw-btn{background:var(--rs);border-color:var(--bd);color:var(--tx-md);}
.root.light .daw-btn:hover{color:var(--tx-hi);}
.root.light .daw-btn.daw-on{border-color:rgba(249,115,22,.4);}
.quiet-active{background:var(--inv-bg) !important;color:var(--inv-tx) !important;border-color:transparent !important;}
.quiet-active:hover{opacity:.9 !important;background:var(--inv-bg) !important;color:var(--inv-tx) !important;}

/* Mask reveal transition */
.quiet-mask{position:fixed;inset:0;z-index:35;clip-path:inset(0 0 calc(100% - var(--hero-h, 320px)) 0);transition:clip-path .85s cubic-bezier(.4,0,.0,1);will-change:clip-path;pointer-events:none;}
.quiet-mask.revealing,.quiet-mask.quiet{pointer-events:auto;}
.quiet-mask.hiding{transition:clip-path .85s cubic-bezier(.4,0,.0,1);pointer-events:none;}
.quiet-mask.normal{pointer-events:none;}

/* Main slide — fades during transition */
.main-slide{position:relative;z-index:40;background:var(--bg);transition:opacity .5s ease .1s,filter .5s ease;}
.main-slide.revealing{opacity:0;filter:blur(2px);pointer-events:none;transition:opacity .6s ease .15s,filter .5s ease .1s;}
.main-slide.quiet{opacity:0;pointer-events:none;transition:none;}
.main-slide.hiding{opacity:1;filter:none;pointer-events:auto;transition:opacity .5s ease .2s,filter .4s ease .15s;}


/* Quiet = fully hidden, instant cut */
/* Reverse: collapsing = coming back from quiet */

/* Quiet widgets — top-right, wider-than-tall, reuse main page cards */
.quiet-widgets{position:absolute;top:58px;right:16px;z-index:10;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(900px,calc(68vw));height:min(360px,calc(52vh - 58px));transform:translateY(-20px);opacity:0;transition:transform .6s cubic-bezier(.22,1,.36,1) .1s,opacity .4s ease .1s;}
.quiet-widgets.show{transform:none;opacity:1;}
.qw{min-width:0;background:var(--sf);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;}
.qw>.card{border:none;border-radius:0;background:transparent;flex:1;min-height:0;overflow:hidden;}
.qw>.card>.ci{height:100%;display:flex;flex-direction:column;}
.qw>.card .cs{flex:1;min-height:0;overflow-y:auto;}
.qw>.card .ch{flex-shrink:0;}
.qw>.card .cf{flex-shrink:0;}
.qw>.card .fb{flex-shrink:0;}
/* Hide verbose elements in quiet mode cards */
.qw>.card .kw-chip{display:none;}
.qw>.card .ti{display:none;}
.qw .mg2{display:none;}
.qw .ch .ntab{display:none;}
.qw>.card .todo-tasks-half .ti{display:none;}
.qw>.card.ni{display:flex;flex-direction:column;}
.qw>.card.ni .todo-wrap{flex:1;min-height:0;overflow:hidden;}
.qw>.card.ni .tmr-hero{min-height:0;padding:8px 12px;}
.qw>.card.ni .tmr-hero svg{width:72px;height:72px;}
.qw>.card.ni .todo-tasks-half{min-height:0;}
.qw>.card .fb .chip{font-size:7px;padding:2px 6px;}
.qw>.card .jr{padding:6px 10px !important;}
.qw>.card .cal-body{padding:4px 8px;}
.root.light .qw{background:rgba(255,255,255,0.85);}
.qw:hover{border-color:var(--bd-hi);}
.qw-head{display:flex;justify-content:space-between;align-items:center;}
.qw-cal-days{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:1px;}
.qw-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;flex:1;grid-auto-rows:1fr;}
.qw-cal-h{text-align:center;font-family:'Space Mono',monospace;font-size:8px;color:var(--tx-lo);padding:3px 0;font-weight:600;}
.qw-cal-d{display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:10px;color:var(--tx-lo);border-radius:3px;transition:all .15s;}
.qw-cal-d.td{background:var(--inv-bg);color:var(--inv-tx);font-weight:700;border-radius:4px;}
.qw-cal-d.ev{color:var(--tx-md);}
.qw-cal-d.dn{color:var(--tx-hi);font-weight:700;}
.qw-cal-d.fu{opacity:.25;cursor:default;}
.qw-cal-d.mt{visibility:hidden;}
.qw-jobs{display:flex;flex-direction:column;gap:6px;flex:1;overflow-y:auto;}
.qw-job{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;transition:background .15s;cursor:pointer;}
.qw-job:hover{background:var(--glow);}

/* Digital clock */
.digi-clock{display:flex;align-items:baseline;gap:2px;margin-bottom:12px;}
.digi-h{font-family:'Space Mono',monospace;font-size:clamp(36px,6vw,64px);font-weight:700;color:var(--tx-hi);letter-spacing:.04em;line-height:1;}
.digi-sep{font-family:'Space Mono',monospace;font-size:clamp(28px,5vw,52px);font-weight:400;color:var(--tx-lo);animation:blink 1s step-end infinite;line-height:1;}
.digi-sec{font-size:clamp(20px,3vw,36px);}
.digi-s{font-family:'Space Mono',monospace;font-size:clamp(20px,3vw,36px);font-weight:400;color:var(--tx-lo);letter-spacing:.04em;line-height:1;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}

/* Quiet branding — scaled up */
.quiet-brand{position:absolute;bottom:32px;left:32px;z-index:10;transform:translateY(40px);opacity:0;transition:transform .7s cubic-bezier(.22,1,.36,1) .15s,opacity .5s ease .15s;}
.quiet-brand.show{transform:none;opacity:1;}
.quiet-title{font-family:'Doto',monospace;font-size:clamp(72px,12vw,140px);font-weight:900;line-height:.88;letter-spacing:.02em;color:var(--tx-hi);}
.quiet-date{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.18em;color:var(--tx-lo);margin-top:14px;text-transform:uppercase;}
.quiet-name{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.20em;color:var(--tx-md);font-weight:700;margin-top:8px;text-transform:uppercase;}

/* Quiet footer */
.quiet-footer{position:absolute;bottom:32px;right:32px;z-index:10;display:flex;align-items:flex-end;gap:10px;transform:translateY(30px);opacity:0;transition:transform .6s cubic-bezier(.22,1,.36,1) .2s,opacity .4s ease .2s;}
.quiet-footer.show{transform:none;opacity:1;}

/* ═══ RESPONSIVE — all breakpoints ═══ */

/* TABLET LANDSCAPE 1024-1399 */
@media(max-width:1399px){
  .quiet-widgets{width:min(780px,calc(60vw));height:min(320px,calc(48vh - 58px));}
}

/* TABLET PORTRAIT 768-1023 */
@media(max-width:1023px){
  .hero-c{padding:12px 16px 14px;}
  .hero-t{font-size:clamp(40px,8vw,72px);}
  .pfp{width:56px;height:56px;}
  .mw{height:72px;padding:8px 12px;}
  .mw-song{font-size:10px;}
  .quiet-widgets{width:calc(100vw - 32px);right:16px;grid-template-columns:repeat(3,1fr);height:min(280px,calc(40vh));}
  .quiet-title{font-size:clamp(56px,10vw,100px);}
  .quiet-date{font-size:12px;margin-top:8px;}
  .quiet-name{font-size:13px;margin-top:8px;}
  .digi-h{font-size:clamp(28px,5vw,48px);}
  .digi-sep{font-size:clamp(22px,4vw,40px);}
  .digi-s{font-size:clamp(16px,2.5vw,28px);}
  .daw-btn{padding:3px 8px;font-size:8px;}
  .mbox{max-width:90vw;}
}

/* MOBILE LANDSCAPE + SMALL TABLETS 640-767 */
@media(max-width:767px){
  .hero{min-height:auto;}
  .hero-c{min-height:auto;padding:12px;}
  .hero-t{font-size:clamp(36px,12vw,56px);}
  .hero-mid{flex-direction:column;gap:14px;}
  .hero-r{align-self:stretch;flex-wrap:wrap;flex-direction:row;}
  .hero-top{flex-wrap:wrap;gap:6px;}
  .hero-top-r{flex-wrap:wrap;gap:4px;}
  .mw{min-width:auto;flex:1;}
  .pfp{width:48px;height:48px;border-radius:8px;}
  /* Quiet mode — stack widgets */
  .quiet-widgets{width:calc(100vw - 24px);right:12px;grid-template-columns:repeat(3,1fr);height:min(220px,30vh);gap:6px;}
  .quiet-brand{left:16px;bottom:80px;}
  .quiet-footer{right:16px;bottom:16px;flex-direction:row;align-items:flex-end;gap:8px;}
  .quiet-title{font-size:clamp(42px,12vw,64px);}
  .quiet-date{font-size:11px;margin-top:6px;letter-spacing:.1em;}
  .quiet-name{font-size:12px;margin-top:6px;letter-spacing:.12em;}
  .digi-h{font-size:clamp(24px,6vw,36px);}
  .digi-sep{font-size:clamp(18px,4vw,28px);}
  .digi-s{font-size:clamp(14px,3vw,22px);}
  .digi-clock{margin-bottom:8px;}
  .quiet-bar{padding:10px 12px;}
  .daw-btn{padding:3px 7px;font-size:7px;gap:3px;}
  .daw-led{width:5px;height:5px;}
  /* Modal — full screen */
  .mbox{max-width:100%;max-height:90vh;border-radius:8px;}
  .mbg{padding:12px;}
  .mbd{padding:14px;}
  /* Cards compact */
  .ch{padding:10px 12px;}
  .qw>.card .ch{padding:8px 10px;}
  .qw>.card .cs{font-size:11px;}
  .qw>.card .lr{padding:4px 8px;}
  .qw>.card .fb .chip{font-size:6px;padding:1px 4px;}
  .qw>.card .cf{padding:4px 8px;}
  .qw>.card.ni .tmr-hero{padding:4px 8px;}
  .qw>.card.ni .tmr-hero svg{width:56px;height:56px;}
}

/* MOBILE PORTRAIT < 480 */
@media(max-width:480px){
  .hero-r{flex-direction:column;align-items:stretch;}
  .pfp{align-self:flex-start;width:44px;height:44px;}
  .hero-t{font-size:clamp(32px,14vw,48px);}
  .hero-top-l{display:none;}
  .mw{min-width:0;padding:6px 8px;}
  .mw-btns{flex-wrap:wrap;}
  .mw-svc{padding:3px 6px;font-size:8px;}
  /* Quiet mode — single column widgets */
  .quiet-widgets{grid-template-columns:1fr 1fr;height:auto;max-height:45vh;top:52px;}
  .quiet-widgets .qw:nth-child(3){grid-column:span 2;}
  .quiet-brand{left:12px;bottom:70px;}
  .quiet-footer{right:12px;bottom:12px;gap:6px;}
  .quiet-title{font-size:clamp(36px,14vw,56px);}
  .quiet-date{font-size:10px;}
  .quiet-name{font-size:11px;}
  .digi-h{font-size:22px;}
  .digi-sep,.digi-s{font-size:16px;}
  .quiet-bar{padding:8px 10px;}
  .daw-btn{padding:2px 6px;font-size:7px;}
  /* Settings modal full bleed */
  .mbg{padding:0;}
  .mbox{max-width:100%;max-height:100vh;border-radius:0;height:100vh;}
  .set-tabs{flex-wrap:wrap;gap:4px;}
  /* Bento card text scale */
  .lr{padding:8px 10px;}
  .kw-chip{font-size:8px;padding:1px 5px;}
  .news-tabs{gap:2px;}
  .ntab{font-size:7px;padding:3px 6px;}
  /* Touch targets */
  .ba{min-height:32px;}
  .chip{min-height:28px;}
  .cal-c{min-height:32px;min-width:32px;}
}

/* VERY SMALL SCREENS < 360 */
@media(max-width:360px){
  .hero-t{font-size:clamp(28px,13vw,40px);}
  .hero-d,.hero-name{font-size:9px;}
  .quiet-widgets{grid-template-columns:1fr;max-height:50vh;}
  .quiet-widgets .qw:nth-child(3){grid-column:span 1;}
  .quiet-title{font-size:clamp(28px,14vw,44px);}
  .quiet-brand{bottom:60px;}
  .daw-btn{font-size:6px;padding:2px 5px;}
  .ch{padding:8px 10px;gap:4px;}
  .tag{font-size:7px;padding:1px 4px;}
}

/* TALL SCREENS — ensure quiet brand doesn't overlap widgets */
@media(min-height:900px){
  .quiet-widgets{height:min(400px,calc(50vh - 58px));}
}

/* SHORT SCREENS — compact quiet mode */
@media(max-height:700px){
  .quiet-widgets{height:min(220px,calc(40vh - 52px));}
  .quiet-brand{bottom:16px;}
  .quiet-footer{bottom:16px;}
  .quiet-title{font-size:clamp(40px,8vw,80px);}
  .digi-h{font-size:clamp(20px,4vw,36px);}
  .digi-sep,.digi-s{font-size:clamp(14px,2.5vw,24px);}
}

/* LANDSCAPE MOBILE — side by side layout */
@media(max-height:500px) and (orientation:landscape){
  .quiet-widgets{top:48px;height:calc(100vh - 120px);grid-template-columns:repeat(3,1fr);}
  .quiet-brand{bottom:8px;left:12px;}
  .quiet-title{font-size:clamp(28px,6vw,48px);}
  .quiet-date,.quiet-name{font-size:9px;margin-top:4px;}
  .digi-clock{margin-bottom:4px;}
  .digi-h{font-size:20px;}
  .digi-sep,.digi-s{font-size:14px;}
  .quiet-footer{bottom:8px;right:8px;}
  .quiet-bar{padding:6px 10px;}
}

/* TOUCH DEVICE ENHANCEMENTS */
@media(hover:none){
  .card:hover{border-color:var(--bd);}
  .card::before,.card::after{display:none;}
  .bento.bh{filter:none;}
  .bento.bh .card:hover{filter:none;}
  .qw:hover{border-color:var(--bd);}
  .daw-btn:hover{border-color:var(--bd);color:var(--tx-md);}
  /* Larger touch targets */
  .ba{min-height:36px;min-width:36px;}
  .chip{min-height:32px;padding:4px 10px;}
  .ntab{min-height:28px;}
  .task-rm{min-width:28px;min-height:28px;}
  .cal-c{min-height:36px;}
  .sb{min-width:36px;min-height:36px;}
  .mx{min-width:36px;min-height:36px;}
}

.mbd{padding:20px;display:flex;flex-direction:column;gap:20px;}
.sr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px;}.sr:last-child{border-bottom:none;}.sr-l{display:flex;align-items:center;gap:8px;min-width:0;}
.set-prov-icon{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:'Space Mono',monospace;color:var(--tx-md);border:1.5px solid var(--bd);flex-shrink:0;border-radius:5px;}.set-prov-icon.sm{width:18px;height:18px;font-size:9px;border-radius:4px;}
.set-add-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px;gap:8px;}
.set-add-btn{display:flex;align-items:center;gap:4px;background:var(--rs);border:1px solid var(--bd);padding:5px 10px;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);border-radius:6px;}.set-add-btn:hover{border-color:var(--bd-hi);}
.set-add-form{padding:12px;background:var(--rs);border:1px solid var(--bd);margin-top:8px;border-radius:8px;}
    `}</style>
  </div>);
}


    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
