// ═══ SMART SORT — weighted priority algorithm ═══
function smartSort(mails){
  const now=Date.now()/1000;
  return[...mails].sort((a,b)=>{
    // Weight: priority(50%) + recency(30%) + unread(20%)
    const recA=Math.max(0,1-(now-a.ts)/172800); // decay over 48h
    const recB=Math.max(0,1-(now-b.ts)/172800);
    const sA=a.pri*0.5+recA*100*0.3+(a.u?20:0);
    const sB=b.pri*0.5+recB*100*0.3+(b.u?20:0);
    return sB-sA;
  });
}

// ═══ HERO BG DITHER ═══
function HeroDither({light}){
  const cv=useRef(null);const af=useRef(null);const t=useRef(0);const mode=useRef(light);
  mode.current=light;
  const draw=useCallback(()=>{const c=cv.current;if(!c)return;const x=c.getContext("2d"),W=c.width,H=c.height;const img=x.createImageData(W,H);const d=img.data;t.current+=.008;const T=t.current;const B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];const isLight=mode.current;for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){const nx=xx/W*3,ny=y/H*3;const v=Math.sin(nx*2.5+T*1.1)*Math.cos(ny*2.5-T*.7)+Math.sin((nx+ny)*1.8+T*.5)*.5+Math.sin(Math.sqrt(nx*nx+ny*ny)*3-T*1.3)*.3+Math.sin(nx*1.2-T*.4)*Math.cos(ny*1.5+T*.6)*.4;const n=(v+2.2)/4.4;const on=n>B[y%4][xx%4]/16;const i=(y*W+xx)*4;if(isLight){const lv=on?Math.floor(180+n*55):240;d[i]=lv;d[i+1]=lv;d[i+2]=lv;d[i+3]=on?80:0;}else{d[i]=d[i+1]=d[i+2]=on?255:0;d[i+3]=on?42:0;}}x.putImageData(img,0,0);af.current=requestAnimationFrame(draw);},[]);
  useEffect(()=>{const c=cv.current;if(!c)return;const rs=()=>{const r=c.parentElement.getBoundingClientRect();c.width=Math.floor(r.width/3);c.height=Math.floor(r.height/3);};rs();window.addEventListener("resize",rs);af.current=requestAnimationFrame(draw);return()=>{window.removeEventListener("resize",rs);cancelAnimationFrame(af.current);};},[draw]);
  return <canvas ref={cv} className="hero-bg"/>;
}

    const S=5;
    const rs=()=>{const r=box.getBoundingClientRect();c.width=Math.floor(r.width/S);c.height=Math.floor(r.height/S);};rs();window.addEventListener("resize",rs);
    const onM=e=>{const r=box.getBoundingClientRect();const nx=(e.clientX-r.left)/S,ny=(e.clientY-r.top)/S;pms.current={x:ms.current.x,y:ms.current.y};ms.current={x:nx,y:ny};const now=Date.now();if(now-ls.current>10){ls.current=now;const dx=ms.current.x-pms.current.x,dy=ms.current.y-pms.current.y;const spd=Math.sqrt(dx*dx+dy*dy);for(let i=0;i<3;i++){const spread=2+Math.random()*2;ps.current.push({x:ms.current.x+(Math.random()-.5)*spread,y:ms.current.y+(Math.random()-.5)*spread,vx:dx*-.03+(Math.random()-.5)*.15,vy:dy*-.03+(Math.random()-.5)*.15,life:1,decay:.012+Math.random()*.008,size:Math.random()*3+2,bright:Math.min(spd*0.15+0.3,1)});}}};
    const onL=()=>{ms.current={x:-999,y:-999};pms.current={x:-999,y:-999};};box.addEventListener("mousemove",onM);box.addEventListener("mouseleave",onL);
    const B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
    const draw=()=>{
      ctx.fillStyle="rgba(0,0,0,0.07)";ctx.fillRect(0,0,c.width,c.height);
      const arr=ps.current;
      for(let i=arr.length-1;i>=0;i--){
        const p=arr[i];p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;
        if(p.life<=0){arr.splice(i,1);continue;}
        const rad=Math.max(1,Math.floor(p.size*p.life));
        const cx=Math.floor(p.x),cy=Math.floor(p.y);
        for(let dy=-rad;dy<=rad;dy++)for(let dx=-rad;dx<=rad;dx++){
          const dist=Math.sqrt(dx*dx+dy*dy)/rad;if(dist>1)continue;
          const intensity=(1-dist)*p.life*p.bright;
          const px=cx+dx,py=cy+dy;
          if(px<0||py<0||px>=c.width||py>=c.height)continue;
          const thr=B[((py%4)+4)%4][((px%4)+4)%4]/16;
          if(intensity>thr){
            ctx.fillStyle=`rgba(255,255,255,${Math.min(intensity*p.life*0.4,0.25)})`;
            ctx.fillRect(px,py,1,1);
          }
        }
      }
      if(arr.length>500)arr.splice(0,arr.length-500);
      af.current=requestAnimationFrame(draw);
    };
    af.current=requestAnimationFrame(draw);
    return()=>{box.removeEventListener("mousemove",onM);box.removeEventListener("mouseleave",onL);window.removeEventListener("resize",rs);cancelAnimationFrame(af.current);};
  },[containerRef]);
  return <canvas ref={cv} className="hero-trail"/>;
}

function ProfilePhoto(){
  const [img,setImg]=useState(null);const [dith,setDith]=useState(null);const [mode,setMode]=useState("dither");const fr=useRef(null);
  const upload=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{setImg(ev.target.result);ditherImg(ev.target.result);};r.readAsDataURL(f);};
  const ditherImg=src=>{const im=new Image();im.onload=()=>{const cv=document.createElement("canvas");const s=96;cv.width=s;cv.height=s;const ctx=cv.getContext("2d");ctx.drawImage(im,0,0,s,s);const id=ctx.getImageData(0,0,s,s);const d=id.data;const B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];for(let y=0;y<s;y++)for(let x=0;x<s;x++){const i=(y*s+x)*4;const g=(d[i]*.3+d[i+1]*.59+d[i+2]*.11)/255;const on=g>B[y%4][x%4]/16?255:0;d[i]=d[i+1]=d[i+2]=on;}ctx.putImageData(id,0,0);setDith(cv.toDataURL());};im.src=src;};
  return(<div className="pfp" onClick={img?()=>setMode(m=>m==="dither"?"normal":"dither"):()=>fr.current?.click()} title={img?"Click to toggle dither":"Click to upload photo"}>

}

function CalendarCard(){
  const [checked,setChecked]=useState(()=>{const s=new Set();[3,4,5,7,8,9,10,12,13,14,15,17,18].forEach(d=>s.add(d));return s;});
  const now=new Date();const yr=now.getFullYear();const today=now.getDate();
  const daysInMonth=new Date(yr,now.getMonth()+1,0).getDate();const firstDay=new Date(yr,now.getMonth(),1).getDay();
  const toggleDay=d=>{if(d>today)return;setChecked(p=>{const n=new Set(p);n.has(d)?n.delete(d):n.add(d);return n;});};
  const streak=(()=>{let s=0;for(let d=today;d>=1;d--){if(checked.has(d)||(d===today))s++;else break;}return s;})();
  return(<Card area="calendar"><Head left={<>{Ic.cal({s:13,c:"var(--tx-hi)"})}<Mo s={11} c="var(--tx-hi)" w={700} ls="0.12em">CALENDAR</Mo></>} right={<div style={{display:"flex",alignItems:"center",gap:5}}>{streak>1&&<Tag inv>{streak}D</Tag>}<Mo s={9} c="var(--tx-lo)">{checked.size}/{daysInMonth}</Mo></div>}/>
    <div className="cal-body">
      <Mo s={10} c="var(--tx-md)" w={600} st={{padding:"0 16px 6px"}}>{now.toLocaleString("en-US",{month:"long"})} {yr}</Mo>
      <div className="cal-days">{["S","M","T","W","T","F","S"].map((d,i)=>(<div key={i} className="cal-dlbl">{d}</div>))}</div>
      <div className="cal-grid">{Array.from({length:firstDay},(_,i)=><div key={"e"+i} className="cal-c"/>)}{Array.from({length:daysInMonth},(_,i)=>{const d=i+1;const done=checked.has(d);const isToday=d===today;const future=d>today;return(<button key={d} onClick={()=>toggleDay(d)} className={`cal-c ${done?"dn":""} ${isToday?"td":""} ${future?"fu":""}`} disabled={future}><span className="cal-n">{d}</span>{done&&<span className="cal-ck">{Ic.check({s:9,c:isToday?"var(--inv-tx)":"var(--tx-hi)"})}</span>}</button>);})}</div>
    </div>
  </Card>);
}

.cal-c{position:relative;display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;border-radius:3px;transition:all .15s cubic-bezier(.4,0,.2,1);padding:0;}
.cal-c:hover:not(.fu):not(:disabled){background:var(--glow);}
.cal-c:active:not(.fu):not(:disabled){transform:scale(.88);}
.cal-c.fu{opacity:.2;cursor:default;}
.cal-c.td{background:var(--inv-bg);}.cal-c.td .cal-n{color:var(--inv-tx);font-weight:700;}
.cal-c.dn:not(.td){background:rgba(255,255,255,.04);}
.root.light .cal-c.dn:not(.td){background:rgba(0,0,0,.04);}
.cal-c.dn{animation:pop .3s cubic-bezier(.4,0,.2,1);}
.cal-n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--tx-lo);font-weight:500;line-height:1;z-index:1;}
.cal-c.dn .cal-n{color:var(--tx-hi);}
.cal-ck{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.25;}
.cal-c.td .cal-ck{opacity:.4;}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:6px;align-content:start;}
.sc{background:var(--rs);border:1px solid var(--bd);padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:6px;}
.sn{font-size:20px;font-weight:800;font-family:'IBM Plex Mono',monospace;line-height:1;color:var(--tx-hi);}
.ba{border:1px solid var(--bd);padding:7px 18px;cursor:pointer;font-size:10px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;transition:all .2s cubic-bezier(.4,0,.2,1);background:transparent;color:var(--tx-lo);border-radius:6px;}
.ba.pri{background:var(--inv-bg);border-color:transparent;color:var(--inv-tx);}.ba.sec{border-color:var(--bd);}.ba:hover{filter:brightness(1.08);}.ba.sec:hover{border-color:var(--bd-hi);color:var(--tx-md);}
.csm{padding:3px 9px;border:1px solid transparent;font-size:9px;font-weight:600;font-family:'IBM Plex Mono',monospace;background:transparent;cursor:pointer;color:var(--tx-lo);border-radius:4px;transition:all .2s cubic-bezier(.4,0,.2,1);}.csm.on{background:var(--inv-bg);border-color:transparent;color:var(--inv-tx);}.csm:hover:not(.on){color:var(--tx-md);}
.aH{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border:none;background:transparent;cursor:pointer;width:100%;text-align:left;flex-shrink:0;gap:8px;transition:background .2s cubic-bezier(.4,0,.2,1);}.aH:hover{background:var(--glow);}.aH.open{border-bottom:1px solid var(--bd);}.aH-l{display:flex;align-items:center;gap:6px;}
.aA{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--tx-hi);width:12px;display:inline-block;}
.aB{flex:0 0 0;overflow:hidden;display:flex;flex-direction:column;transition:flex .3s cubic-bezier(.4,0,.2,1);}.aB.open{flex:0 1 auto;overflow:auto;}
.ck{width:14px;height:14px;border:1.5px solid;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;border-radius:3px;transition:all .15s;}.ck.done{border-color:var(--tx-lo);background:var(--glow);color:var(--tx-md);}
.ti{display:flex;gap:6px;padding:6px 10px;border-top:1px solid var(--bd);flex-shrink:0;}
.inp{flex:1;background:var(--rs);border:1px solid var(--bd);padding:6px 10px;color:var(--tx-hi);font-size:11px;outline:none;font-family:inherit;min-width:0;transition:all .2s cubic-bezier(.4,0,.2,1);border-radius:6px;}.inp:focus{border-color:var(--bd-hi);box-shadow:0 0 0 2px var(--glow);}
.ab2{background:transparent;border:1px solid var(--bd);color:var(--tx-lo);padding:6px 10px;cursor:pointer;font-size:9px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;flex-shrink:0;transition:all .2s cubic-bezier(.4,0,.2,1);border-radius:6px;}.ab2:hover{background:var(--inv-bg);color:var(--inv-tx);border-color:transparent;}
.ri{width:30px;height:30px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--rs);border-radius:6px;}
.stxt{font-size:11px;color:var(--tx-md);line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.li{padding:10px 16px;display:flex;flex-direction:column;gap:6px;background:var(--sf);border:1px solid var(--bd);height:100%;}
.ll{display:flex;flex-direction:column;}.ln{font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s;}
.ef{display:flex;gap:8px;align-items:center;}
.sel{flex:1;background:var(--rs);border:1px solid var(--bd);padding:7px 12px;color:var(--tx-hi);font-size:11px;font-family:'IBM Plex Mono',monospace;outline:none;min-width:0;cursor:pointer;border-radius:6px;transition:all .2s cubic-bezier(.4,0,.2,1);}.sel:focus{border-color:var(--bd-hi);box-shadow:0 0 0 2px var(--glow);}
.eta{background:var(--rs);border:1px solid var(--bd);padding:10px 12px;color:var(--tx-hi);font-size:11px;font-family:'IBM Plex Mono',monospace;outline:none;resize:vertical;line-height:1.5;min-height:80px;border-radius:6px;transition:all .2s cubic-bezier(.4,0,.2,1);}.eta:focus{border-color:var(--bd-hi);box-shadow:0 0 0 2px var(--glow);}
.send-btn{background:var(--inv-bg);border:1px solid transparent;color:var(--inv-tx);padding:8px 20px;cursor:pointer;font-size:10px;font-weight:600;font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;transition:all .2s cubic-bezier(.4,0,.2,1);border-radius:6px;}.send-btn:hover{opacity:.85;}.send-btn:disabled{opacity:.4;cursor:default;}
.save-tpl-btn{background:none;border:none;cursor:pointer;padding:2px 0;opacity:.6;transition:opacity .2s;}.save-tpl-btn:hover{opacity:1;}
.save-tpl-row{display:flex;gap:4px;margin-top:4px;align-items:center;}
.tpl-del{background:none;border:none;cursor:pointer;color:var(--tx-lo);font-size:9px;padding:2px 4px;line-height:1;transition:all .2s;border-radius:3px;}.tpl-del:hover{color:var(--tx-hi);background:var(--glow);}
.mbg{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px;animation:mdIn .2s cubic-bezier(.4,0,.2,1);}
@keyframes mdIn{from{opacity:0;}to{opacity:1;}}
.root.light .mbg{background:rgba(0,0,0,.25);}
.mbox{background:var(--sf);border:1px solid var(--bd);width:100%;max-width:520px;max-height:80vh;overflow:auto;border-radius:12px;box-shadow:0 24px 48px rgba(0,0,0,.25);animation:mdBox .25s cubic-bezier(.4,0,.2,1);}
@keyframes mdBox{from{opacity:0;transform:scale(.97) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}

/* ═══ MICRO ANIMATIONS ═══ */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92);}to{opacity:1;transform:scale(1);}}
@keyframes slideR{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:none;}}
@keyframes slideL{from{opacity:0;transform:translateX(8px);}to{opacity:1;transform:none;}}
@keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.15);}100%{transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-2px);}40%{transform:translateX(2px);}60%{transform:translateX(-1px);}80%{transform:translateX(1px);}}
@keyframes check{from{stroke-dashoffset:24;}to{stroke-dashoffset:0;}}
@keyframes strike{from{width:0;}to{width:100%;}}
@keyframes pulse3{0%,100%{opacity:1;}50%{opacity:.5;}}
@keyframes countPop{0%{transform:scale(1);}50%{transform:scale(1.25);}100%{transform:scale(1);}}
@keyframes sendFly{0%{transform:translateX(0) translateY(0) scale(1);opacity:1;}100%{transform:translateX(12px) translateY(-8px) scale(.7);opacity:0;}}
@keyframes dotPing{0%{transform:scale(1);opacity:.7;}100%{transform:scale(2.5);opacity:0;}}
@keyframes shimmer{0%{background-position:-200% 0;}100%{background-position:200% 0;}}
@keyframes logSlide{from{opacity:0;transform:translateY(10px);filter:blur(2px);}to{opacity:1;transform:none;filter:blur(0);}}
@keyframes timerDone{0%,100%{box-shadow:0 0 0 0 transparent;}50%{box-shadow:0 0 20px 4px rgba(255,255,255,.12);}}
@keyframes breathe{0%,100%{opacity:.35;}50%{opacity:.55;}}

/* Row entrance stagger */
.lr{animation:fadeUp .3s cubic-bezier(.4,0,.2,1) both;}
.cs>.lr:nth-child(1){animation-delay:0s;}.cs>.lr:nth-child(2){animation-delay:.03s;}.cs>.lr:nth-child(3){animation-delay:.06s;}.cs>.lr:nth-child(4){animation-delay:.09s;}.cs>.lr:nth-child(5){animation-delay:.12s;}.cs>.lr:nth-child(6){animation-delay:.15s;}.cs>.lr:nth-child(7){animation-delay:.18s;}.cs>.lr:nth-child(8){animation-delay:.21s;}.cs>.lr:nth-child(9){animation-delay:.24s;}.cs>.lr:nth-child(10){animation-delay:.27s;}

/* Mail category tiles stagger */
.mt2{animation:scaleIn .3s cubic-bezier(.4,0,.2,1) both;}
.mg2>.mt2:nth-child(1){animation-delay:0s;}.mg2>.mt2:nth-child(2){animation-delay:.04s;}.mg2>.mt2:nth-child(3){animation-delay:.08s;}.mg2>.mt2:nth-child(4){animation-delay:.12s;}

/* Mail feed items stagger */
.mail-feed-item{animation:fadeUp .25s cubic-bezier(.4,0,.2,1) both;}
.mail-feed>.mail-feed-item:nth-child(1){animation-delay:0s;}.mail-feed>.mail-feed-item:nth-child(2){animation-delay:.03s;}.mail-feed>.mail-feed-item:nth-child(3){animation-delay:.06s;}.mail-feed>.mail-feed-item:nth-child(4){animation-delay:.09s;}.mail-feed>.mail-feed-item:nth-child(5){animation-delay:.12s;}

/* Unread dot ping animation */
.mail-unread-dot{position:relative;}.mail-unread-dot::after{content:'';position:absolute;inset:0;border-radius:50%;background:inherit;animation:dotPing 2s cubic-bezier(0,0,.2,1) infinite;}

/* Task checkbox animation */
.ck{transition:all .25s cubic-bezier(.4,0,.2,1);}.ck:active{transform:scale(.85);}.ck.done{animation:pop .3s cubic-bezier(.4,0,.2,1);}
.ck.done svg{animation:check .3s cubic-bezier(.4,0,.2,1) both;}

/* Star save bounce */
.sb{transition:transform .2s cubic-bezier(.4,0,.2,1);}.sb:active{transform:scale(.8);}.sb svg{transition:transform .3s cubic-bezier(.4,0,.2,1);}
.star-pop svg{animation:pop .35s cubic-bezier(.4,0,.2,1);}

/* Tag count pop */
.tag{transition:all .2s cubic-bezier(.4,0,.2,1);}
.tag-pop{animation:countPop .3s cubic-bezier(.4,0,.2,1);}

/* Send button fly */
.send-fly{animation:sendFly .5s cubic-bezier(.4,0,.2,1) forwards;}

/* Timer completion flash */
.timer-done{animation:timerDone .8s ease 2;}

/* Log line entrance */
.ln{animation:logSlide .35s cubic-bezier(.4,0,.2,1) both;}

/* News tab content fade */
.news-fade{animation:fadeUp .3s cubic-bezier(.4,0,.2,1) both;}

/* Chip active transition */
.chip{transition:all .2s cubic-bezier(.4,0,.2,1);}.chip:active{transform:scale(.94);}
.ntab{transition:all .2s cubic-bezier(.4,0,.2,1);}.ntab:active{transform:scale(.95);}

/* Button press */
.ba{transition:all .2s cubic-bezier(.4,0,.2,1);}.ba:active{transform:scale(.95);}
.send-btn{transition:all .2s cubic-bezier(.4,0,.2,1);}.send-btn:active:not(:disabled){transform:scale(.96);}
.send-btn.sending{animation:pulse3 .8s ease infinite;background:linear-gradient(90deg,var(--inv-bg) 40%,var(--bd-hi) 50%,var(--inv-bg) 60%);background-size:200% 100%;animation:shimmer 1.5s ease infinite;}
.ab2{transition:all .2s cubic-bezier(.4,0,.2,1);}.ab2:active{transform:scale(.95);}
.hub-btn:active,.lt-btn:active{transform:scale(.94);}

/* Settings toggle smooth */
.set-toggle:active{transform:scale(.9);}

/* Profile photo hover breathe */
.pfp{transition:all .25s cubic-bezier(.4,0,.2,1);}.pfp:hover{transform:scale(1.03);}

/* Stats cards entrance */
.sc{animation:scaleIn .3s cubic-bezier(.4,0,.2,1) both;}
.sg>.sc:nth-child(1){animation-delay:0s;}.sg>.sc:nth-child(2){animation-delay:.05s;}.sg>.sc:nth-child(3){animation-delay:.1s;}.sg>.sc:nth-child(4){animation-delay:.15s;}

/* Stat number shimmer on hover */
.sn{transition:color .2s;}
.sc:hover .sn{color:var(--tx-hi);}

/* Settings section entrance */
.set-section{animation:fadeUp .25s cubic-bezier(.4,0,.2,1);}
.set-field{animation:fadeUp .3s cubic-bezier(.4,0,.2,1) both;}
.set-section>.set-field:nth-child(1){animation-delay:0s;}.set-section>.set-field:nth-child(2){animation-delay:.04s;}.set-section>.set-field:nth-child(3){animation-delay:.08s;}.set-section>.set-field:nth-child(4){animation-delay:.12s;}.set-section>.set-field:nth-child(5){animation-delay:.16s;}.set-section>.set-field:nth-child(6){animation-delay:.2s;}

/* Layout preset button hover lift */
.set-layout-btn{transition:all .2s cubic-bezier(.4,0,.2,1);}.set-layout-btn:hover{transform:translateY(-2px);}.set-layout-btn:active{transform:translateY(0) scale(.97);}

/* Accordion icon rotate */
.aA{transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;}

/* News icon shimmer */
.ri{transition:all .2s cubic-bezier(.4,0,.2,1);}.lr:hover .ri{transform:scale(1.08);border-color:var(--bd-hi);}

/* Social lead card hover */
.stxt{transition:color .2s;}.lr:hover .stxt{color:var(--tx-md);}

/* Music widget hover */
.mw{transition:all .25s cubic-bezier(.4,0,.2,1);}.mw:hover{border-color:rgba(255,255,255,.12);}
.root.light .mw:hover{border-color:rgba(0,0,0,.1);}

/* Hero text entrance */
.hero-t{animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .1s both;}
.hero-d{animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .2s both;}
.hero-name{animation:fadeUp .6s cubic-bezier(.4,0,.2,1) .3s both;}

/* Hover all → link */
.cf Mo[style*="cursor"]:hover{text-decoration:underline;text-underline-offset:2px;}
.mbox-lg{max-width:580px;}
.set-tabs{display:flex;gap:3px;padding:0 20px 12px;border-bottom:1px solid var(--bd);}
.set-section{display:flex;flex-direction:column;gap:16px;}
.set-field{display:flex;flex-direction:column;gap:6px;}
.set-inp{padding:7px 12px !important;font-size:12px !important;background:var(--rs) !important;border-color:var(--bd) !important;}
.set-inp:focus{border-color:var(--bd-hi) !important;outline:none;}
.set-layouts{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.set-layout-btn{background:var(--rs);border:1px solid var(--bd);padding:10px 8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s cubic-bezier(.4,0,.2,1);border-radius:8px;}.set-layout-btn:hover{border-color:var(--bd-hi);}.set-layout-btn.on{border-color:var(--tx-hi);background:var(--glow);}
.set-layout-preview{width:100%;display:flex;flex-direction:column;gap:2px;padding:0 4px;}
.set-toggle{width:32px;height:18px;border-radius:9px;border:1px solid var(--bd);background:var(--rs);cursor:pointer;position:relative;transition:all .25s cubic-bezier(.4,0,.2,1);padding:0;flex-shrink:0;}
.set-toggle.on{background:var(--tx-hi);border-color:transparent;}
.set-toggle-dot{width:12px;height:12px;border-radius:50%;background:var(--tx-lo);position:absolute;top:2px;left:2px;transition:all .25s cubic-bezier(.4,0,.2,1);}
.set-toggle.on .set-toggle-dot{left:16px;background:var(--sf);}
.set-cards-list{border:1px solid var(--bd);padding:4px 12px;border-radius:8px;}
.mhd{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd);}.mx{background:none;border:none;color:var(--tx-lo);cursor:pointer;padding:4px;border-radius:6px;transition:all .15s;display:flex;align-items:center;justify-content:center;}.mx:hover{color:var(--tx-hi);background:var(--glow);}
.mbd{padding:20px;display:flex;flex-direction:column;gap:20px;}
.sr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px;}.sr:last-child{border-bottom:none;}.sr-l{display:flex;align-items:center;gap:8px;min-width:0;}
.set-prov-icon{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:'IBM Plex Mono',monospace;color:var(--tx-md);border:1.5px solid var(--bd);flex-shrink:0;border-radius:5px;}.set-prov-icon.sm{width:18px;height:18px;font-size:9px;border-radius:4px;}
.set-add-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px;gap:8px;}
.set-add-btn{display:flex;align-items:center;gap:4px;background:var(--rs);border:1px solid var(--bd);padding:5px 10px;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);border-radius:6px;}.set-add-btn:hover{border-color:var(--bd-hi);}
.set-add-form{padding:12px;background:var(--rs);border:1px solid var(--bd);margin-top:8px;border-radius:8px;}
    `}</style>
  </div>);
